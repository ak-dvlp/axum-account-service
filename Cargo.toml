[package]
name = "axum-account-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Веб-фреймворк и среда выполнения
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }

# Работа с базой данных
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "macros", "chrono"] }

# Сериализация и типы данных
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Безопасность и авторизация
bcrypt = "0.19.2"
jsonwebtoken = "10.4.0"

# Веб-инструменты (CORS, логирование)
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Работа с переменными окружения
dotenvy = "0.15.7"
